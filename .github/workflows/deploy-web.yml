name: Deploy web to GitHub Pages

on:
  push:
    branches: [claude/best-me-app-planning-kqzw49, main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Export web build
        run: npx expo export --platform web
        env:
          CI: "1"

      - name: Prepare Pages output
        run: |
          # SPA fallback for deep links
          cp dist/index.html dist/404.html
          # Stop Jekyll from ignoring the _expo asset directory
          touch dist/.nojekyll

      - name: Publish to gh-pages branch
        run: |
          cd dist
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy web build ${GITHUB_SHA::7}"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
